<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="TerraVista AI estimates historical housing values from the Boston Housing dataset.">
    <title>{{ title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='typography.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='spa.css') }}">
</head>
<body data-initial-view="{{ active_page }}">
    <div class="page-grid" aria-hidden="true"></div>
    <header class="site-header">
        <a class="wordmark" href="{{ url_for('home') }}#home"><span>TV</span> TerraVista <em>AI</em></a>
        <nav class="primary-nav" aria-label="Primary navigation">
            <a href="{{ url_for('home') }}#home" data-nav="home">Home</a>
            <a href="{{ url_for('home') }}#predict" data-nav="predict">Predict</a>
            <a href="{{ url_for('home') }}#insights" data-nav="insights">Model Insights</a>
            <a href="{{ url_for('home') }}#about" data-nav="about">About</a>
        </nav>
        <span class="header-status"><i></i> Educational model</span>
    </header>
    <main id="app-main" tabindex="-1">{% block content %}{% endblock %}</main>
    <footer class="site-footer shell"><span>TerraVista AI / 2026</span><span>Read the shape of a place.</span><span>Historical data / educational use</span></footer>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
